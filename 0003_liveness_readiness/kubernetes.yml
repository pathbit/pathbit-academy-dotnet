apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-api
  template:
    metadata:
      labels:
        app: health-api
    spec:
      containers:
        - name: api
          image: pathbit-health-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Dependency__HealthUrl
              value: http://dependency/
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-api
spec:
  selector:
    app: health-api
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dependency
  template:
    metadata:
      labels:
        app: dependency
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dependency
spec:
  selector:
    app: dependency
  ports:
    - port: 80
      targetPort: http
